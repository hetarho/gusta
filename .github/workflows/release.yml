name: Publish Package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Skip when this version is already on npm
        id: guard
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "haeram-spec-creator@${VERSION}" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "haeram-spec-creator@${VERSION} is already on npm — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "haeram-spec-creator@${VERSION} is not on npm yet — publishing."
          fi
      - if: steps.guard.outputs.publish == 'true'
        run: npm run release:check
      - name: Prepare provenance conflict recovery
        if: steps.guard.outputs.publish == 'true'
        # npm/cli#10078: keep provenance enabled and fetch an existing Rekor
        # entry after a retry-after-success 409, using Sigstore's recovery path.
        run: |
          npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
          node scripts/prepare-publish.mjs "$(npm root -g)/npm"
          HAERAM_PUBLISH_NPM_ROOT="$(npm root -g)/npm" node --test test/publish-tools.test.mjs
      - if: steps.guard.outputs.publish == 'true'
        # release:check above already ran the prepublishOnly validation.
        run: npm publish --ignore-scripts --provenance
